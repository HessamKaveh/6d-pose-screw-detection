[project]
name = "screwpose"
version = "1.0.0"
description = "General-purpose screw/nut detection and 6D pose estimation from RGB-D"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["ultralytics>=8.3", "opencv-python>=4.8", "numpy>=1.24", "scipy>=1.10", "pyyaml>=6.0"]

[tool.setuptools]
packages = ["screwpose"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 120
extend-exclude = ["data", "runs", "outputs", "weights"]

[tool.ruff.lint]
select = ["E", "F"]
# E501: long lines; E702: compact `a; b` one-liners in research code.
ignore = ["E501", "E702"]
