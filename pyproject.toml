[project]
name = "screwpose"
version = "1.0.0"
description = "General-purpose screw/nut detection and 6D pose estimation from RGB-D"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["ultralytics>=8.3", "opencv-python>=4.8", "numpy>=1.24", "scipy>=1.10", "pyyaml>=6.0"]

[tool.setuptools]
packages = ["screwpose"]

[tool.pytest.ini_options]
pythonpath = ["."]
